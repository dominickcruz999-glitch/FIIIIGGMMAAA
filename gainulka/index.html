function smooth(pts, closed = true) {

// spiky fur outline: straight zigzag along a coarse polygon
function furPath(pts, amp, seg = 4) {

function drawEnding2() {

function drawEnding() {
  if (level === 2) return drawEnding2();

    const s = Math.min(1, (endT - .2) * 5);

/* ---------- render ---------- */
function render() {
  ctx.save();
  if (cam.shake > 0) ctx.translate(rnd(-cam.shake, cam.shake), rnd(-cam.shake, cam.shake) * .6);
  if (cam.zoom > 1.001) { const zk = clamp((cam.zoom - 1) / .75, 0, 1); ctx.translate(lerp(cam.fx, W / 2, zk), lerp(cam.fy, H * .62, zk)); ctx.scale(cam.zoom, cam.zoom); ctx.translate(-cam.fx, -cam.fy); }
  if (level === 2) drawOffice(); else { drawSky(); drawFar(); drawHouses(); drawMid(); drawRoad(); }
  for (const e of ents) if (e.type === 'taxi') drawTaxi(e);
  for (const p of props) drawProp(p);
  for (const e of ents) if (e.type === 'puddle') drawPuddle(e);
  for (const it of items) {
    const x = it.x - cam.x; if (x < -50 || x > W + 50) continue;
    const by = it.y + Math.sin(it.ph) * 5;
    if (it.type === 'daisy') drawDaisy(x, by, 16, Math.sin(it.ph * .5) * .3);

    else { heartPath(x, by, 32); fs('#ff4f7f', 3.5); ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.ellipse(x - 6, by - 8, 4, 3, -.6, 0, 7); ctx.fill(); }
  }
  for (const t of treats) drawTreat(t);
  if (state !== 'title' && state !== 'story') {
    for (const e of ents) {
      const x = e.x - cam.x; if (x < -150 || x > W + 150) continue;
      if (e.type === 'pigeon') drawPigeon(e); else if (e.type === 'rat') drawRat(e); else if (e.type === 'baba') drawBaba(e);
      else if (e.type === 'clock') drawClock(e); else if (e.type === 'ticket') drawTicket(e); else if (e.type === 'colleague') drawColleague(e); else if (e.type === 'printer') drawPrinter(e); else if (e.type === 'zoomwin') drawZoomWin(e);
      if (e.trapped) {

    const rockyInArms = state === 'ending' && hugT >= 0 && !pairHug;
    if (pairHug) drawHugPair();
    else if (boss && boss.kind === 'outlook') { if (boss.state !== 'defeated') drawOutlook(boss); }
    else if (boss && !rockyInArms) drawRocky(boss.x - cam.x, boss.y, boss);

    if (boss && rockyInArms && !pairHug) drawRocky(boss.x - cam.x + (boss.hugShift || 0) * boss.facing, boss.y, boss);
    for (const s of shots) s.kind ? drawWineShot(s) : drawShot(s);
    for (const f of foes) drawFoe(f);
    if (boss && boss.kind === 'outlook' && boss.state === 'defeated') drawOutlook(boss);
  }
  for (const p of parts) drawPart(p);
  ctx.restore();
  vignette();
  if (state === 'title') drawTitle();
  else if (state === 'story') drawStory();
  else {
    drawHUD();
    if (state === 'bossintro') drawBossIntro();
    if (state === 'over') drawOver();
    if (state === 'paused') drawPaused();
    if (state === 'ending') drawEnding();
  }
  drawCursor();
}

/* ---------- loop ---------- */
buildLevel(); resetPlayer(300);
let last = performance.now();
function frame(now) {
  let dt = Math.min(.033, (now - last) / 1000); last = now; time += dt;
  if (hitstop > 0) { hitstop -= dt; dt *= .15; }
  if (!window.__freeze) { update(dt); render(); }
  consume();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// test hook
window.__gainulka = {
  get state() { return state; }, set state(v) { state = v; stateT = 0; },
  P, get boss() { return boss; }, get level() { return level; }, start(lv) { if (lv) level = lv; startGame(); },
  hit(v) { if (boss && boss.kind === 'outlook') { boss.hp = Math.max(0, boss.hp - v); if (boss.hp <= 0) startEnding2(); } else addFriend(v); }, warp(x) { P.x = x; cam.x = clamp(x - 400, 0, ARENA_X); },
  friend(v) { addFriend(v); },
  closeup(sc, opts = {}) {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#e9e1d4'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.scale(sc, sc);
    drawDiana(opts.dx ?? 90, opts.dy ?? 250, Object.assign({ facing: 1, ph: 0, air: false, vx: 0, aim: -.2, pose: 'normal', shootAnim: 0, groundY: opts.dy ?? 250 }, opts.d || {}));
    drawRocky(opts.rx ?? 330, opts.dy ?? 250, Object.assign({ facing: -1, anim: 0, vx: 0, onGround: true, mood: .2, mouth: 0, sit: 0, flash: 0, state: 'idle' }, opts.r || {}));
    ctx.restore();
  },
};
})();
