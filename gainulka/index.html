(() => {
'use strict';
/* =========================================================

const audio = {
  ac: null, master: null, muted: false,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }

      this.ac = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ac.createGain(); this.master.gain.value = .55; this.master.connect(this.ac.destination);

    bass: [48, null, null, null, 43, null, null, null, 45, null, null, null, 41, null, 43, null] },
  boss: { dt: .135, wave: 'square', vol: .03,
    mel: [69, 72, 76, 72, 69, 72, 76, 79, 77, 76, 74, 72, 71, 72, 74, null, 69, 72, 76, 81, 79, 77, 76, 74, 72, 71, 69, 71, 72, null, 76, null],
    bass: [45, null, 45, null, 41, null, 41, null, 43, null, 43, null, 40, null, 44, null] },
  win: { dt: .16, wave: 'triangle', vol: .06,
    mel: [72, 76, 79, 84, 79, 76, 77, 81, 84, 89, 84, 81, 79, 83, 86, 91, null, null, 84, null, 88, null, 91, null, 96, null, null, null, null, null, null, null],
    bass: [48, null, null, null, 53, null, null, null, 55, null, null, null, 48, null, null, null] },

const music = {
  song: null, step: 0, next: 0, timer: null,
  play(name) {
    this.song = name; this.step = 0;
    if (!audio.ac) return;
    this.next = audio.ac.currentTime + .06;
    if (!this.timer) this.timer = setInterval(() => this.tick(), 40);
  },
  tick() {
    const ac = audio.ac; if (!ac || !this.song) return;
    const s = SONGS[this.song];
    while (this.next < ac.currentTime + .2) {
      const m = s.mel[this.step % s.mel.length], b = s.bass[this.step % s.bass.length];
      const hz = n => 440 * Math.pow(2, (n - 69) / 12);
      if (m != null) audio.toneAt(hz(m), this.next, s.dt * 1.6, s.wave, s.vol);
      if (b != null) audio.toneAt(hz(b), this.next, s.dt * 3, 'triangle', .07);

/* ---------------- palettes ---------------- */
const C = {
  skin: '#f3ceb4', skinSh: '#dba78c', hair: '#4a2a1e', hairHi: '#73442f', top: '#232027', topHi: '#3a3640',
  jeans: '#a3c4e2', jeansSh: '#7fa3c8', shoe: '#f6f2ea', lips: '#c46a6b', blush: 'rgba(240,120,120,.35)',
  gunA: '#46cfc2', gunB: '#ff7fb2',
  rDark: '#5b4f49', rMid: '#7c6758', rTan: '#c79c6c', rWhite: '#f3eee6', rNose: '#201715',
};

/* ---------------- game state ---------------- */
let state = 'title', time = 0, stateT = 0, hitstop = 0;
const P = {};
const cam = { x: 0, y: 0, shake: 0, lock: false };
let ents = [], shots = [], foes = [], items = [], parts = [], treats = [], props = [], platforms = [];
let boss = null, daisies = 0, daisyTotal = 0, checkpoint = 300, bubbles = 0, runTime = 0;
let banner = null; // {text, sub, t}

function resetPlayer(x) {
  Object.assign(P, { x, y: GROUND, vx: 0, vy: 0, onGround: true, coyote: 0, facing: 1, hp: 5, maxHp: 5,
    inv: 0, cool: 0, ph: 0, aim: 0, treatCool: 0, ctrl: true, pose: 'normal', drop: 0, shootAnim: 0 });
}

/* ---------------- level ---------------- */
function addPlat(x, y, w) { platforms.push({ x, y, w }); }
function buildLevel() {
  ents = []; shots = []; foes = []; items = []; parts = []; treats = []; props = []; platforms = [];
  boss = null; cam.lock = false; daisies = 0; bubbles = 0; runTime = 0;

  props.push({ t: 'parents', x: 40 });
  props.push({ t: 'hint', x: 560, lines: ['A / D  или  ← →  — идти', 'Пробел или W — прыжок'] });
  props.push({ t: 'hint', x: 960, lines: ['Мышь — целиться', 'Левая кнопка — пузыри'] });
  ents.push({ type: 'puddle', x: 1160, w: 120 });
  props.push({ t: 'hint', x: 1420, lines: ['Пузыри уносят любые', 'проблемы. Даже голубей'] });
  ents.push(mk('pigeon', 1620, GROUND - 12));
  ents.push(mk('pigeon', 1720, GROUND - 12));
  props.push({ t: 'crates', x: 1960, w: 90, h: 80 }); addPlat(1960, GROUND - 80, 90);
  props.push({ t: 'garage', x: 2070, w: 250, h: 135 }); addPlat(2070, GROUND - 135, 250);
  ents.push(mk('bag', 2520, GROUND)); ents.push(mk('bag', 2680, GROUND));
  ents.push(mk('baba', 2980, GROUND));
  props.push({ t: 'stop', x: 3330, w: 210 }); addPlat(3330, GROUND - 142, 210);
  ents.push({ type: 'puddle', x: 3600, w: 140 });
  ents.push({ type: 'bustrig', x: 3560 });
  ents.push(mk('pigeon', 3820, 360, true)); ents.push(mk('pigeon', 3950, 330, true));
  props.push({ t: 'kiosk', x: 4120, w: 230, h: 150, label: 'ПРОДУКТЫ 24' }); addPlat(4120, GROUND - 150, 230);
  props.push({ t: 'checkpoint', x: 4040 });
  props.push({ t: 'pipe', x: 4560, w: 540 });
  addPlat(4560, 528, 200); addPlat(4752, 428, 116); addPlat(4860, 528, 240);
  ents.push(mk('bag', 4700, GROUND)); ents.push(mk('bag', 4980, GROUND));
  ents.push(mk('baba', 5300, GROUND));
  props.push({ t: 'stop', x: 5520, w: 210 }); addPlat(5520, GROUND - 142, 210);
  ents.push({ type: 'puddle', x: 5800, w: 120 });
  ents.push({ type: 'bustrig', x: 5760 });
  props.push({ t: 'crates', x: 5990, w: 80, h: 70 }); addPlat(5990, GROUND - 70, 80);
  props.push({ t: 'crates', x: 6070, w: 80, h: 140 }); addPlat(6070, GROUND - 140, 80);
  props.push({ t: 'garage', x: 6150, w: 210, h: 115 }); addPlat(6150, GROUND - 115, 210);
  ents.push(mk('pigeon', 6300, 330, true)); ents.push(mk('pigeon', 6420, 300, true)); ents.push(mk('bag', 6500, GROUND));
  ents.push(mk('baba', 6700, GROUND));
  props.push({ t: 'gate', x: 6930 });
  props.push({ t: 'arena', x: ARENA_X });

  const D = [[700, 520], [780, 500], [860, 520], [1220, 470], [1500, 540], [2005, 480], [2150, 420], [2230, 420], [2300, 420],
    [2600, 540], [3080, 520], [3400, 410], [3480, 410], [3600, 470], [3670, 470], [4190, 400], [4260, 400], [4810, 380],
    [4620, 480], [5000, 480], [5430, 540], [5600, 410], [5830, 470], [6110, 380], [6250, 400], [6620, 540], [6800, 520]];
  for (const [x, y] of D) items.push({ type: 'daisy', x, y, ph: Math.random() * 6 });

  items.push({ type: 'heart', x: 2800, y: 530, ph: 0 });

}
function mk(type, x, y, air) {
  const e = { type, x, y, vx: 0, vy: 0, t: Math.random() * 3, seed: Math.random() * 10, facing: -1, hp: 1, flash: 0 };

const pBox = () => ({ l: P.x - 15, r: P.x + 15, t: P.y - 150, b: P.y - 4 });

/* ---------------- particles ---------------- */

}

}
function updatePlayer(dt) {

  p.vx += (ax * 345 - p.vx) * Math.min(1, dt * (p.onGround ? 14 : 5));
  const jumpKey = pressed.Space || pressed.KeyW || pressed.ArrowUp;
  if (p.ctrl && jumpKey && (p.onGround || p.coyote > 0)) {
    p.vy = -900; p.onGround = false; p.coyote = 0; sfx.jump(); dust(p.x, p.y, 5);
  }
  if (p.ctrl && (pressed.KeyS || pressed.ArrowDown) && p.onGround && p.y < GROUND) { p.drop = .25; p.y += 2; p.onGround = false; }
  if (!(keys.Space || keys.KeyW || keys.ArrowUp) && p.vy < -380) p.vy = -380;
  p.vy = Math.min(p.vy + G * dt, 1500);
  const prevY = p.y, wasAir = !p.onGround;
  p.x += p.vx * dt; p.y += p.vy * dt;
  const minX = cam.lock ? ARENA_X + 40 : 30, maxX = cam.lock ? ARENA_X + W - 40 : LEVEL_END - 40;
  p.x = clamp(p.x, minX, maxX);
  p.onGround = false; p.drop -= dt;
  if (p.y >= GROUND) { p.y = GROUND; p.vy = 0; p.onGround = true; }
  else if (p.vy >= 0 && p.drop <= 0) {
    for (const pl of platforms) {
      if (p.x > pl.x - 8 && p.x < pl.x + pl.w + 8 && prevY <= pl.y + 1 && p.y >= pl.y) { p.y = pl.y; p.vy = 0; p.onGround = true; break; }
    }
  }
  if (p.onGround && wasAir) dust(p.x, p.y, 4);

  if (p.onGround && Math.abs(p.vx) > 30) p.ph += Math.abs(p.vx) * dt * .045; else if (p.onGround) p.ph = 0;
  p.inv -= dt; p.cool -= dt; p.treatCool -= dt; p.shootAnim -= dt;

    const sx = p.x - cam.x, sy = p.y - 122;

    if ((mouse.down || keys.KeyJ) && p.cool <= 0) shoot();

  }
}
function muzzle() {
  const dx = Math.cos(P.aim) * P.facing, dy = Math.sin(P.aim);
  return { x: P.x + P.facing * 6 + dx * 70, y: P.y - 124 + dy * 70 - 2, dx, dy };
}
function shoot() {

    const blink = Math.floor(time * 8) % 2;
    ctx.save(); ctx.translate(W - 70, 420);
    rr(-150, -30, 200, 60, 10); fs(blink ? '#ffe14d' : '#ffb84d', 4);
    bodyText('МАРШРУТКА!', -50, 0, 22, INK, 'center', 900);
    ctx.restore();
    comicText('→', W - 40, 420, 40, '#ff5c8a');
  }
  ctx.save(); ctx.translate(x, y);
  rr(-130, -128, 260, 112, 16); fs('#f2c230');
  rr(-120, -116, 70, 40, 6); fs('#8fc0dc', 3);
  for (let k = 0; k < 3; k++) { rr(-40 + k * 52, -116, 44, 40, 4); fs('#8fc0dc', 3); }
  ctx.fillStyle = '#e04848'; ctx.fillRect(-128, -66, 256, 10);
  rr(-80, -150, 160, 26, 6); fs('#fff', 3);
  bodyText('№ 2 · ЦЕНТР', 0, -137, 16, INK, 'center', 900);
  for (const wx of [-80, 80]) { ell(wx, -14, 22, 22); fs('#2a2626', 4); ell(wx, -14, 9, 9); fs('#a8a8a8', 3); }
  ell(-132, -40, 6, 8); fs('#fff6b0', 3);
  ctx.restore();
}
function drawSlipper(x, y, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  rr(-24, -8, 48, 16, 8); fs('#8b5a3c', 3.5);
  ctx.beginPath(); ctx.moveTo(-2, -6); ctx.quadraticCurveTo(14, -20, 22, -4); ctx.closePath(); fs('#c4333b', 3);
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(6, -12); ctx.lineTo(14, -6); ctx.moveTo(12, -15); ctx.lineTo(18, -9); ctx.stroke();
  ctx.restore();
}
function drawDaisy(x, y, r, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  for (let k = 0; k < 9; k++) { ctx.save(); ctx.rotate(k / 9 * 6.28); ell(0, -r * .62, r * .26, r * .5); fs('#ffffff', 2.5); ctx.restore(); }
  ell(0, 0, r * .36, r * .36); fs('#ffcc33', 2.5);
  ctx.restore();
}
function drawTreat(t) {
  ctx.save(); ctx.translate(t.x - cam.x, t.y); ctx.rotate(t.rot);
  ctx.beginPath(); ctx.arc(-14, -5, 6, 0, 7); ctx.arc(-14, 5, 6, 0, 7); ctx.arc(14, -5, 6, 0, 7); ctx.arc(14, 5, 6, 0, 7); ctx.fillStyle = '#e6b878'; ctx.fill();
  rr(-14, -5, 28, 10, 3); ctx.fill();
  ctx.beginPath(); ctx.arc(-14, -5, 6, 0, 7); ctx.arc(-14, 5, 6, 0, 7); ctx.arc(14, -5, 6, 0, 7); ctx.arc(14, 5, 6, 0, 7); ink(3); ctx.stroke();
  ctx.restore();
}

function drawShot(s) {
  const x = s.x - cam.x, r = s.r * (1 + Math.sin(s.wob) * .06);
  const g = ctx.createRadialGradient(x - r * .3, s.y - r * .3, r * .1, x, s.y, r);
  g.addColorStop(0, 'rgba(255,255,255,.55)'); g.addColorStop(.6, 'rgba(190,240,255,.18)'); g.addColorStop(1, 'rgba(255,170,220,.5)');
  ctx.beginPath(); ctx.arc(x, s.y, r, 0, 7); ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(27,20,17,.75)'; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(x - r * .35, s.y - r * .4, r * .25, r * .15, -.6, 0, 7); ctx.fill();
}
function drawFoe(f) {
  const x = f.x - cam.x;
  switch (f.kind) {
    case 'phrase':
      ctx.save(); ctx.translate(x, f.y);
      rr(-f.w / 2, -f.h / 2, f.w, f.h, 14); fs('#fff8ec', 3.5);
      ctx.beginPath(); ctx.moveTo(-f.w / 2 + 14, f.h / 2 - 2); ctx.lineTo(-f.w / 2 + 4, f.h / 2 + 12); ctx.lineTo(-f.w / 2 + 26, f.h / 2 - 2); ctx.fillStyle = '#fff8ec'; ctx.fill(); ink(3.5); ctx.stroke();
      bodyText(f.text, 0, 1, 20, '#7a1a26');
      ctx.restore(); break;
    case 'gav': {
      const s = 1 + Math.sin(time * 30) * .08;
      ctx.save(); ctx.translate(x, f.y); ctx.scale(s, s);
      ctx.beginPath();
      for (let k = 0; k < 14; k++) { const a = k / 14 * 6.28, r = k % 2 ? 26 : 38; ctx.lineTo(Math.cos(a) * r * 1.3, Math.sin(a) * r * .75); }
      ctx.closePath(); fs('#ffe14d', 3.5);
      comicText('ГАВ!', 0, 1, 20, '#ff5c8a', 0, 4);
      ctx.restore(); break;
    }
    case 'drop':
      ctx.save(); ctx.translate(x, f.y); ctx.rotate(Math.atan2(f.vy, f.vx) - Math.PI / 2);
      ctx.beginPath(); ctx.moveTo(0, 12); ctx.quadraticCurveTo(9, -2, 0, -10); ctx.quadraticCurveTo(-9, -2, 0, 12); fs('#7cc3ee', 3);
      ctx.restore(); break;
    case 'slipper': drawSlipper(x, f.y, f.rot); break;
    case 'wave': {
      ctx.save(); ctx.translate(x, GROUND);
      ctx.beginPath(); ctx.moveTo(-f.w / 2 - 20, 0);
      ctx.quadraticCurveTo(-f.w / 2, -f.h, 0, -f.h); ctx.quadraticCurveTo(f.w / 2 + 10, -f.h * .9, f.w / 2 + 30, 0); ctx.closePath(); fs('#5aa7d8', 4);
      ctx.beginPath(); ctx.moveTo(-f.w / 2, -f.h * .7); ctx.quadraticCurveTo(-10, -f.h - 12, 20, -f.h * .8); ctx.strokeStyle = '#e8f7ff'; ctx.lineWidth = 6; ctx.stroke();
      ctx.restore(); break;
    }
  }
}
function drawPart(p) {
  const x = p.x - cam.x, k = p.life / p.max;
  switch (p.kind) {
    case 'spark':
      ctx.fillStyle = p.color; ctx.globalAlpha = k; ctx.beginPath(); ctx.arc(x, p.y, p.size * k + 1, 0, 7); ctx.fill(); ctx.globalAlpha = 1; break;
    case 'ring':
      ctx.globalAlpha = k; ctx.strokeStyle = p.color; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, p.y, p.size * (1.4 - k), 0, 7); ctx.stroke(); ctx.globalAlpha = 1; break;
    case 'dust':
      ctx.globalAlpha = k * .8; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(x, p.y, p.size * (1.5 - k * .5), 0, 7); ctx.fill(); ctx.globalAlpha = 1; break;
    case 'drop':
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(x, p.y, p.size * .6, 0, 7); ctx.fill(); break;
    case 'leaf':
      ctx.save(); ctx.translate(x, p.y); ctx.rotate(p.rot); ell(0, 0, p.size, p.size * .5); ctx.fillStyle = p.color; ctx.fill(); ctx.strokeStyle = 'rgba(27,20,17,.6)'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore(); break;
    case 'heart':
      ctx.globalAlpha = Math.min(1, k * 2); heartPath(x, p.y, p.size); fs(p.color, 3); ctx.globalAlpha = 1; break;
    case 'text': {
      const s = k > .8 ? 1 + (k - .8) * 3 : 1;
      ctx.globalAlpha = Math.min(1, k * 2.5);
      comicText(p.text, x, p.y, p.size * s, p.color, p.rot);
      ctx.globalAlpha = 1; break;
    }
    case 'say': {
      ctx.globalAlpha = Math.min(1, k * 3);
      ctx.font = `700 ${p.size}px ${FB}`; const w = ctx.measureText(p.text).width + 30;
      rr(x - w / 2, p.y - 22, w, 44, 16); fs('#fff8ec', 3.5);
      bodyText(p.text, x, p.y, p.size, '#c4333b');
      ctx.globalAlpha = 1; break;
    }
  }
}

/* ---------- HUD ---------- */
function drawHUD() {
  for (let i = 0; i < P.maxHp; i++) {
    const x = 44 + i * 44, y = 46, s = 34 + (i === P.hp - 1 && P.hp <= 2 ? Math.sin(time * 10) * 3 : 0);
    heartPath(x, y, s); fs(i < P.hp ? '#ff4f7f' : 'rgba(255,255,255,.18)', 3.5);
    if (i < P.hp) { ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.ellipse(x - 7, y - 9, 4, 3, -.6, 0, 7); ctx.fill(); }
  }
  drawDaisy(46, 100, 18, time * .5);
  comicText(`${daisies}/${daisyTotal}`, 112, 101, 22, '#fff3df', 0, 5);
  // progress strip
  if (!cam.lock) {
    const px = 980, pw = 260, k = clamp(P.x / (ARENA_X + 330), 0, 1);
    rr(px, 34, pw, 12, 6); fs('rgba(255,243,223,.25)', 3);
    rr(px, 34, Math.max(12, pw * k), 12, 6); ctx.fillStyle = '#ff7fb2'; ctx.fill();
    bodyText('дом родителей', px, 64, 13, '#fff3df', 'left', 700);
    bodyText('дом любимого', px + pw, 64, 13, '#fff3df', 'right', 700);
    heartPath(px + pw * k, 40, 22); fs('#ff4f7f', 3);
  }
  if (boss && state !== 'bossintro') {
    const bw = 520, bx = W / 2 - bw / 2, by = 36;
    comicText('РОККИ', W / 2, by - 6, 22, '#fff3df', 0, 5);
    rr(bx, by + 12, bw, 22, 11); fs('#3a2a30', 4);
    const k = boss.f / 100;
    const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    g.addColorStop(0, '#ff5c8a'); g.addColorStop(1, '#ffb3cf');
    if (k > 0) { rr(bx + 3, by + 15, (bw - 6) * k, 16, 8); ctx.fillStyle = g; ctx.fill(); }
    bodyText(k < 1 ? `дружба ${Math.floor(boss.f)}%` : 'лучшие друзья', W / 2, by + 23, 13, '#fff3df', 'center', 900);
    // treat button
    if (state === 'play') {
      const tx = 60, ty = H - 60, ready = P.treatCool <= 0;
      ell(tx, ty, 34, 34); fs(ready ? '#ffd36b' : 'rgba(255,211,107,.35)', 4);
      drawTreat({ x: tx + cam.x, y: ty, rot: -.4 });
      if (!ready) { ctx.beginPath(); ctx.moveTo(tx, ty); ctx.arc(tx, ty, 34, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (P.treatCool / 4.5)); ctx.closePath(); ctx.fillStyle = 'rgba(27,20,17,.55)'; ctx.fill(); }
      bodyText('E / ПКМ', tx + 44, ty, 15, '#fff3df', 'left', 900);
    }
  }
  if (audio.muted) bodyText('звук выкл · M', W - 20, H - 24, 14, '#fff3df', 'right');
}
function drawCursor() {
  if (state !== 'play') return;
  const x = mouse.x, y = mouse.y;
  ctx.beginPath(); ctx.arc(x, y, 12, 0, 7); ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.stroke(); ctx.strokeStyle = '#ff7fb2'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fill();
}
function vignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * .95);
  g.addColorStop(0, 'rgba(20,10,20,0)'); g.addColorStop(1, 'rgba(20,10,20,.5)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

/* ---------- screens ---------- */
function panel(x, y, w, h, fill = '#fff3df', rot = 0) {
  ctx.save(); ctx.translate(x + w / 2, y + h / 2); ctx.rotate(rot);
  rr(-w / 2 + 8, -h / 2 + 10, w, h, 10); ctx.fillStyle = INK; ctx.fill();
  rr(-w / 2, -h / 2, w, h, 10); fs(fill, 5);
  ctx.restore();
}
function drawTitle() {
  ctx.fillStyle = 'rgba(20,10,22,.35)'; ctx.fillRect(0, 0, W, H);
  const wob = Math.sin(time * 2) * .02;
  ctx.save(); ctx.translate(W / 2, 190); ctx.rotate(-.04 + wob);
  ctx.font = `118px ${FD}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = 26; ctx.strokeStyle = INK; ctx.strokeText('ГАЙНУЛКА', 8, 10);
  ctx.strokeText('ГАЙНУЛКА', 0, 0);
  const g = ctx.createLinearGradient(0, -60, 0, 60); g.addColorStop(0, '#ffe14d'); g.addColorStop(.55, '#ff9a5c'); g.addColorStop(1, '#ff4f7f');
  ctx.fillStyle = g; ctx.fillText('ГАЙНУЛКА', 0, 0);
  ctx.restore();
  ctx.save(); ctx.translate(W / 2, 292); ctx.rotate(.02);
  rr(-250, -24, 500, 48, 8); fs('#46cfc2', 4);
  bodyText('игра ко дню рождения Дианы', 0, 1, 24, INK, 'center', 900);
  ctx.restore();
  drawDiana(330, 600, { facing: 1, ph: 0, air: false, vx: 0, aim: -.35, pose: 'normal', shootAnim: 0, groundY: 600 });
  drawRocky(980, 600, { facing: -1, anim: time, vx: 0, onGround: true, mood: .2, mouth: Math.max(0, Math.sin(time * 3)) * .3, sit: 0, flash: 0 });
  panel(440, 380, 400, 150, '#fff3df', -.01);
  bodyText('Уровень 1', W / 2, 410, 18, '#7a1a26', 'center', 900);
  comicText('ДОРОГА К ЛЮБИМОМУ', W / 2, 446, 24, '#ff7fb2', 0, 6);
  if (Math.floor(time * 2) % 2) bodyText('Кликни, чтобы начать', W / 2, 496, 22, INK, 'center', 900);
  bodyText('лучше играть на компьютере · M — звук', W / 2, 690, 15, 'rgba(255,243,223,.75)');
}
function drawStory() {
  ctx.fillStyle = 'rgba(20,10,22,.55)'; ctx.fillRect(0, 0, W, H);
  panel(200, 90, 880, 470, '#fff3df', -.006);
  comicText('ОКТЯБРЬ. РОДНОЙ ГОРОДОК.', W / 2, 150, 30, '#ff7fb2', 0, 7);
  const lines = [
    'Диана выходит из дома родителей.',
    'Её ждёт любимый, на другом конце города.',
    'Но голуби, пакеты и бабушки на лавочках',
    'явно против этой встречи.',
    '',
    'Хорошо, что у Дианы есть пистолет',
    'с мыльными пузырями.',
  ];
  lines.forEach((l, i) => bodyText(l, W / 2, 222 + i * 36, 25, INK, 'center', 700));
  if (stateT > .4 && Math.floor(time * 2) % 2) bodyText('Кликни, чтобы пойти', W / 2, 520, 22, '#7a1a26', 'center', 900);
}
function drawBossIntro() {
  const k = Math.min(1, stateT * 3);
  ctx.fillStyle = INK; ctx.fillRect(0, 0, W, 90 * k); ctx.fillRect(0, H - 90 * k, W, 90 * k);
  if (stateT > .3) {
    const s = Math.min(1, (stateT - .3) * 4);
    ctx.save(); ctx.translate(380 - (1 - s) * 600, 300); ctx.rotate(-.05);
    rr(-260, -70, 520, 190, 10); ctx.fillStyle = INK; ctx.fill();
    rr(-268, -80, 520, 190, 10); fs('#ffe14d', 5);
    ctx.restore();
    ctx.save(); ctx.translate(380 - (1 - s) * 600, 300); ctx.rotate(-.05);
    comicText('РОККИ', -8, -14, 64, '#ff5c8a', 0, 12);
    bodyText('лайка · гроза заборов', -8, 42, 22, INK, 'center', 900);
    bodyText('Однажды укусил Диану. Пора мириться.', -8, 76, 19, '#7a1a26', 'center', 700);
    ctx.restore();
  }
  if (stateT > 1.2) {
    panel(760, 520, 440, 86, '#fff3df', .01);
    bodyText('Пузыри повышают дружбу', 980, 548, 19, INK, 'center', 900);
    bodyText('E или ПКМ — бросить вкусняшку', 980, 578, 19, '#7a1a26', 'center', 700);
  }
}
function drawOver() {
  ctx.fillStyle = 'rgba(20,10,22,.6)'; ctx.fillRect(0, 0, W, H);
  comicText('ОЙ!', W / 2, 260, 110, '#ff5c8a', -.05, 18);
  bodyText(cam.lock ? 'Рокки пока не готов дружить. Ещё разок?' : 'Городок оказался сильнее. Ещё разок?', W / 2, 370, 26, '#fff3df', 'center', 700);
  if (stateT > .8 && Math.floor(time * 2) % 2) bodyText('Кликни, чтобы продолжить', W / 2, 430, 22, '#ffe14d', 'center', 900);
}
function drawPaused() {
  ctx.fillStyle = 'rgba(20,10,22,.55)'; ctx.fillRect(0, 0, W, H);
  comicText('ПАУЗА', W / 2, 300, 80, '#ffe14d', 0, 14);
  bodyText('P, Esc или клик — продолжить', W / 2, 390, 22, '#fff3df');
}
function drawEnding() {
  if (endT > .2 && endT < 4.2) {
    const s = Math.min(1, (endT - .2) * 5);
    comicText('РОККИ ПРИРУЧЁН!', W / 2, 200, 64 * (0.6 + .4 * s), '#ff5c8a', -.04, 14);
  }
  if (endT > 4.2) {
    const s = Math.min(1, (endT - 4.2) * 3);
    ctx.fillStyle = `rgba(20,10,22,${.55 * s})`; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.globalAlpha = s;
    panel(250, 90, 780, 470, '#fff3df', -.01);
    comicText('УРОВЕНЬ 1 ПРОЙДЕН', W / 2, 160, 42, '#ff5c8a', 0, 10);
    bodyText('Рокки больше не кусается. Теперь он лучший друг.', W / 2, 228, 24, INK, 'center', 700);
    drawDaisy(W / 2 - 150, 290, 20, time);
    bodyText(`ромашки: ${daisies} из ${daisyTotal}`, W / 2 + 10, 290, 24, INK, 'center', 900);
    bodyText(`время: ${Math.floor(runTime / 60)}:${String(Math.floor(runTime % 60)).padStart(2, '0')} · пузырей: ${bubbles}`, W / 2, 330, 20, '#7a1a26', 'center', 700);
    rr(W / 2 - 250, 372, 500, 84, 10); fs('#2f5a8f', 4);
    bodyText('Дальше · Уровень 2', W / 2, 398, 18, '#bff3ff', 'center', 700);
    comicText('ОПЕНСПЕЙС', W / 2, 430, 30, '#ffe14d', 0, 7);
    if (endT > 7 && Math.floor(time * 2) % 2) bodyText('Кликни, чтобы сыграть ещё раз', W / 2, 510, 20, INK, 'center', 900);
    ctx.restore();
  }
}

/* ---------- render ---------- */
function render() {
  ctx.save();
  if (cam.shake > 0) ctx.translate(rnd(-cam.shake, cam.shake), rnd(-cam.shake, cam.shake) * .6);
  drawSky(); drawFar(); drawHouses(); drawMid(); drawRoad();
  for (const e of ents) if (e.type === 'bus') drawBus(e);
  for (const p of props) drawProp(p);
  for (const e of ents) if (e.type === 'puddle') drawPuddle(e);
  for (const it of items) {
    const x = it.x - cam.x; if (x < -50 || x > W + 50) continue;
    const by = it.y + Math.sin(it.ph) * 5;
    if (it.type === 'daisy') drawDaisy(x, by, 16, Math.sin(it.ph * .5) * .3);
    else { heartPath(x, by, 32); fs('#ff4f7f', 3.5); ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.ellipse(x - 6, by - 8, 4, 3, -.6, 0, 7); ctx.fill(); }
  }
  for (const t of treats) drawTreat(t);
  if (state !== 'title' && state !== 'story') {
    for (const e of ents) {
      const x = e.x - cam.x; if (x < -150 || x > W + 150) continue;
      if (e.type === 'pigeon') drawPigeon(e); else if (e.type === 'bag') drawBag(e); else if (e.type === 'baba') drawBaba(e);
      if (e.trapped) {
        const r = e.type === 'bag' ? 46 : 34, cy = e.type === 'bag' ? e.y - 30 : e.y - 4;
        drawShot({ x: e.x, y: cy, r, wob: time * 6 });
      }
    }
    if (boss) drawRocky(boss.x - cam.x, boss.y, boss);
    const blink = P.inv > 0 && state === 'play' && Math.floor(time * 16) % 2 === 0;
    let gy = GROUND;
    for (const pl of platforms) if (P.x > pl.x - 8 && P.x < pl.x + pl.w + 8 && P.y <= pl.y + 1 && pl.y < gy) gy = pl.y;
    drawDiana(P.x - cam.x, P.y, { facing: P.facing, ph: P.ph, air: !P.onGround && state === 'play', vx: P.vx, aim: P.aim, pose: P.pose, shootAnim: P.shootAnim, blink, groundY: gy, happy: state === 'ending' });
    for (const s of shots) drawShot(s);
    for (const f of foes) drawFoe(f);
  }
  for (const p of parts) drawPart(p);
  ctx.restore();
  vignette();
  if (state === 'title') drawTitle();
  else if (state === 'story') drawStory();
  else {
    drawHUD();
    if (state === 'bossintro') drawBossIntro();
    if (state === 'over') drawOver();
    if (state === 'paused') drawPaused();
    if (state === 'ending') drawEnding();
  }
  drawCursor();
}

/* ---------- loop ---------- */
buildLevel(); resetPlayer(300);
let last = performance.now();
function frame(now) {
  let dt = Math.min(.033, (now - last) / 1000); last = now; time += dt;
  if (hitstop > 0) { hitstop -= dt; dt *= .15; }
  update(dt); render(); consume();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// test hook
window.__gainulka = {
  get state() { return state; }, set state(v) { state = v; stateT = 0; },
  P, get boss() { return boss; }, start: startGame, warp(x) { P.x = x; cam.x = clamp(x - 400, 0, ARENA_X); },
  friend(v) { addFriend(v); },
};
})();
</script>
